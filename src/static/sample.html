#create a simple HTML page with a header, paragraph, and a button that changes the text of the paragraph when clicked.```html
<!DOCTYPE html>
<html lang="en">
<head><title>Simple HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Simple HTML Page</h1>
    <p id="myParagraph">This is a simple paragraph. Click the button below to change this text.</p>
    <button onclick="changeText()">Click Me!</button>
    <script>
        function changeText() {
            document.getElementById("myParagraph").innerText = "The text has been changed! Thank you for clicking the button.";
        }
    </script>
</body>
</html>
